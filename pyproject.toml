[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cacao-aroma-corridor-pipeline"
version = "1.0.0"
description = "Spreadsheet-first pipeline for cacao fruity-aroma genomic corridor portability analysis."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Ezekiel Ahn"}
]
dependencies = [
  "numpy>=1.26",
  "openpyxl>=3.1",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "python-dateutil>=2.8",
  "xlrd>=2.0.1",
]

[project.scripts]
cacao-pipeline = "cacao_aroma_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
